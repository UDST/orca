[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
dynamic = ["version"]
description = "Python library for task orchestration"
readme = "README.rst"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "UrbanSim Inc.", email = "info@urbansim.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5,<4",
    "tables>=3.8",
    "toolz>=0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = [
    "build>=1.2",
    "ruff>=0.12",
    "twine>=6",
]

[project.urls]
Documentation = "https://udst.github.io/orca/"
Repository = "https://github.com/UDST/orca"
Issues = "https://github.com/UDST/orca/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "orca.__version__"}

[tool.setuptools.packages.find]
include = ["orca", "orca.*"]
exclude = ["orca.tests", "orca.tests.*", "orca.utils.tests", "orca.utils.tests.*"]

[tool.pytest.ini_options]
testpaths = ["orca/tests", "orca/utils/tests"]
filterwarnings = [
    "ignore:object name is not a valid Python identifier:tables.NaturalNameWarning",
]

[tool.coverage.run]
source = ["orca"]

[tool.coverage.report]
show_missing = true
omit = ["orca/tests/*", "orca/utils/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
